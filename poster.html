<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد صور أرشيف الوارد للنشر</title>
    <!-- مكتبة تحويل الشاشة إلى صورة عالية الدقة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: #1e293b; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            font-family: 'Tajawal', sans-serif; 
            margin: 0;
        }
        .control-panel { 
            background: white; 
            padding: 15px 30px; 
            border-radius: 10px; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        button { 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            font-weight: 700;
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Tajawal'; 
            color: white;
            transition: 0.2s;
        }
        .btn-download { background: #16a34a; }
        .btn-download:hover { background: #15803d; }
        .btn-clear { background: #dc2626; }
        .btn-clear:hover { background: #b91c1c; }

        /* حاوية الصورة الأساسية */
        #capture-area {
            width: 1080px;  
            height: 1350px; 
            background-image: url('طلبات المواطنين نشر اعتماد.png');
            background-size: 100% 100%;
            background-position: top center;
            background-repeat: no-repeat;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background-color: white;
        }

        /* شبكة الجدول الشفافة فوق الصورة (تم تعديل الإحداثيات لتطابق صورتك) */
        .table-overlay {
            position: absolute;
            top: 29.5%;  /* تم التنزيل قليلاً لتجنب الاصطدام بالخط العلوي */
            bottom: 18.2%; 
            left: 4.8%; 
            right: 9.3%;
            display: flex;
            flex-direction: column;
        }

        .row {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .cell {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        /* توزيع عرض الأعمدة لتطابق التصميم (من اليمين لليسار) */
        .col-name { flex: 4; }       
        .col-ministry { flex: 1.8; } 
        .col-type { flex: 1.8; }     
        .col-margin { flex: 1.8; }   

        /* استخدام DIV قابل للكتابة بدل الـ input لحل مشكلة التصدير */
        .editable-cell {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px; 
            font-weight: 700;
            color: #0f172a;
            outline: none;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            /* دفع النص للأسفل قليلاً ليتوسط المربع بصرياً */
            padding-top: 4px; 
        }

        /* تصميم النصوص المؤقتة (Placeholders) */
        .editable-cell:empty:before {
            content: attr(data-placeholder);
            color: rgba(0,0,0,0.18);
            font-weight: 400;
        }

        /* كلاس لإخفاء النصوص المؤقتة عند أخذ الصورة */
        .hide-placeholders .editable-cell:empty:before {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- لوحة التحكم للموظف -->
    <div class="control-panel" id="controls">
        <button class="btn-download" onclick="downloadImage()"><i class="fas fa-camera"></i> حفظ الصورة بدقة عالية للنشر</button>
        <button class="btn-clear" onclick="clearFields()"><i class="fas fa-trash-alt"></i> تفريغ الجدول</button>
    </div>

    <!-- المساحة التي سيتم تصويرها -->
    <div id="capture-area">
        <div class="table-overlay" id="rows-container">
            <!-- سيتم توليد الـ 15 سطر هنا -->
        </div>
    </div>

    <script>
        // 1. توليد حقول الإدخال الـ 15 لتطابق الصورة
        const container = document.getElementById('rows-container');
        for (let i = 1; i <= 15; i++) {
            container.innerHTML += `
                <div class="row">
                    <div class="cell col-name"><div class="editable-cell" contenteditable="true" data-placeholder="اكتب الاسم"></div></div>
                    <div class="cell col-ministry"><div class="editable-cell" contenteditable="true" data-placeholder="الوزارة"></div></div>
                    <div class="cell col-type"><div class="editable-cell" contenteditable="true" data-placeholder="نوع الطلب"></div></div>
                    <div class="cell col-margin"><div class="editable-cell" contenteditable="true" data-placeholder="الهامش"></div></div>
                </div>
            `;
        }

        // 2. دالة التقاط الشاشة وتحويلها لصورة
        function downloadImage() {
            const captureArea = document.getElementById('capture-area');
            const btn = document.querySelector('.btn-download');
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التصدير...';
            btn.disabled = true;

            // إخفاء الـ Placeholders حتى لا تظهر في الصورة إذا كان الحقل فارغاً
            captureArea.classList.add('hide-placeholders');

            // التقاط الصورة بدقة مضروبة بـ 3
            html2canvas(captureArea, { 
                scale: 3, 
                useCORS: true,
                backgroundColor: "#ffffff",
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'موقف_الطلبات_المنجزة_' + Date.now() + '.jpg';
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();

                // إعادة كل شيء لطبيعته
                btn.innerHTML = originalText;
                btn.disabled = false;
                captureArea.classList.remove('hide-placeholders');
            }).catch(err => {
                alert("حدث خطأ أثناء حفظ الصورة!");
                btn.innerHTML = originalText;
                btn.disabled = false;
                captureArea.classList.remove('hide-placeholders');
            });
        }

        // 3. دالة تفريغ الحقول
        function clearFields() {
            if(confirm("هل أنت متأكد من تفريغ كافة الحقول؟")) {
                document.querySelectorAll('.editable-cell').forEach(inp => inp.innerText = '');
            }
        }
    </script>
</body>
</html>
